<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Definitions for gradients and drop shadows -->
  <defs>
    <!-- Soft shadow for the islands -->
    <filter id="island-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#1e2a19" flood-opacity="0.08" />
    </filter>
    
    <!-- Stylized gradient for the island landmass -->
    <linearGradient id="island-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f5ed" />
      <stop offset="50%" stop-color="#e8edd8" />
      <stop offset="100%" stop-color="#dfebd1" />
    </linearGradient>
  </defs>

  <!-- Clean Warm Ocean/Map Background Grid -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Grid Lines (Latitude & Longitude) for vintage field guide style -->
  <g stroke="#263b27" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4,4">
    <!-- Vertical lines (Longitude) -->
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />

    <!-- Horizontal lines (Latitude) -->
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="220" x2="800" y2="220" />
    <line x1="0" y1="340" x2="800" y2="340" />
    <line x1="0" y1="460" x2="800" y2="460" />
  </g>

  <!-- Tiny coordinate markers in corners -->
  <g fill="#263b27" fill-opacity="0.3" font-size="8" font-family="monospace" letter-spacing="0.05em">
    <text x="15" y="95">8°15' S</text>
    <text x="15" y="215">8°30' S</text>
    <text x="15" y="335">8°45' S</text>
    
    <text x="255" y="490">115°00' E</text>
    <text x="555" y="490">115°30' E</text>
  </g>

  <!-- MAIN BALI ISLAND PATH -->
  <path d="M 20,100 C 150,60 300,30 504,20 C 600,20 700,80 780,200 C 790,260 700,300 600,330 C 530,350 490,410 430,460 C 410,480 390,460 390,440 C 390,420 420,380 410,360 C 330,350 200,300 100,220 C 50,180 30,130 20,100 Z" 
        fill="url(#island-grad)" 
        stroke="#425f32" 
        stroke-opacity="0.18" 
        stroke-width="1.5" 
        filter="url(#island-shadow)" />

  <!-- NUSA PENIDA -->
  <path d="M 680,395 C 700,385 720,390 725,405 C 725,415 710,425 690,420 C 680,415 675,405 680,395 Z" 
        fill="url(#island-grad)" 
        stroke="#425f32" 
        stroke-opacity="0.18" 
        stroke-width="1.5" 
        filter="url(#island-shadow)" />

  <!-- NUSA LEMBONGAN -->
  <path d="M 635,365 C 645,360 655,365 655,372 C 655,378 645,382 638,378 C 632,375 632,368 635,365 Z" 
        fill="url(#island-grad)" 
        stroke="#425f32" 
        stroke-opacity="0.18" 
        stroke-width="1.5" 
        filter="url(#island-shadow)" />

  <!-- Stylized Compass Rose / Compass Design Elements (top-left) -->
  <g transform="translate(100, 400)" stroke="#263b27" stroke-opacity="0.12" fill="none">
    <circle cx="0" cy="0" r="24" stroke-width="0.75" />
    <circle cx="0" cy="0" r="28" stroke-width="0.5" stroke-dasharray="2,2" />
    <!-- Compass points -->
    <line x1="0" y1="-32" x2="0" y2="32" stroke-width="1" />
    <line x1="-32" y1="0" x2="32" y2="0" stroke-width="1" />
    <!-- Inner diamonds -->
    <path d="M 0,-24 L 4,0 L 0,24 L -4,0 Z" fill="#263b27" fill-opacity="0.06" stroke-width="0.5" />
    <path d="M -24,0 L 0,4 L 24,0 L 0,-4 Z" fill="#263b27" fill-opacity="0.06" stroke-width="0.5" />
    <!-- Mini labels -->
    <text x="-3" y="-36" font-size="8" font-family="serif" font-weight="bold" fill="#263b27" fill-opacity="0.35" stroke="none">N</text>
  </g>
</svg>
